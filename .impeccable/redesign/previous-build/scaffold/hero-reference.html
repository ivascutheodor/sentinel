<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Scaffold reference: conventional-dashboard.png</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Ysabeau+SC:wght@700&display=swap">
  <link rel="stylesheet" href="layout.css">
  <style>html,body{margin:0}body{background:#f6f7f8}.region{box-sizing:border-box}.region.text p{white-space:pre-wrap}</style>
</head>
<body>
<!-- Reference only. Every region sits at its measured box inside a comp-aspect frame. Take the boxes (layout.css), keep your own semantic structure. -->
<main class="comp-frame" style="max-width:1586px">
  <div class="r-application-ground region chrome" data-region="application-ground"><!-- One flat pale-gray application background beneath individually named content and controls --></div>
  <div class="r-sidebar region chrome" data-region="sidebar"><!-- Navy navigation rail; flat surface --></div>
  <div class="r-brand region text" data-region="brand"><!-- SENTINEL brand label --><p style="font-size:var(--r-brand-font);line-height:1.05;margin:0">brand</p></div>
  <div class="r-navigation region control" data-region="navigation"><!-- Overview and Events navigation buttons: rebuild the control's chrome from the crop (comp-spec.mjs --crop navigation); its ink box, border, fill, radius, and label size are the comp's --></div>
  <div class="r-account region control" data-region="account"><!-- Operator account control: rebuild the control's chrome from the crop (comp-spec.mjs --crop account); its ink box, border, fill, radius, and label size are the comp's --></div>
  <div class="r-page-heading region text" data-region="page-heading"><!-- Overview heading --><p style="font-size:var(--r-page-heading-font);font-family:var(--r-page-heading-family),sans-serif;font-weight:var(--r-page-heading-weight);line-height:1.05;margin:0">page-heading</p></div>
  <div class="r-demo-meta region text" data-region="demo-meta"><!-- Demo data and current example time --><p style="font-size:var(--r-demo-meta-font);line-height:1.05;margin:0">demo-meta</p></div>
  <div class="r-camera01-title region text" data-region="camera01-title"><!-- Storage room 01 --><p style="font-size:var(--r-camera01-title-font);line-height:1.05;margin:0">camera01-title</p></div>
  <div class="r-camera01-status region text" data-region="camera01-status"><!-- Live and detection state plus last-frame time --><p style="font-size:var(--r-camera01-status-font);line-height:1.05;margin:0">camera01-status</p></div>
  <figure class="r-camera01 region plate" data-region="camera01"><img src="../../../frontend/public/demo/storage-room-01.jpg" alt="" style="width:100%;height:100%;object-fit:contain;object-position:top left"></figure>
  <div class="r-camera02-title region text" data-region="camera02-title"><!-- Storage room 02 --><p style="font-size:var(--r-camera02-title-font);line-height:1.05;margin:0">camera02-title</p></div>
  <div class="r-camera02-status region text" data-region="camera02-status"><!-- Live and detection state plus last-frame time --><p style="font-size:var(--r-camera02-status-font);line-height:1.05;margin:0">camera02-status</p></div>
  <figure class="r-camera02 region plate" data-region="camera02"><img src="../../../frontend/public/demo/storage-room-02.jpg" alt="" style="width:100%;height:100%;object-fit:contain;object-position:top left"></figure>
  <div class="r-events-heading region text" data-region="events-heading"><!-- Recent events heading --><p style="font-size:var(--r-events-heading-font);line-height:1.05;margin:0">events-heading</p></div>
  <div class="r-event-filters region control" data-region="event-filters"><!-- Camera and time period native select controls: rebuild the control's chrome from the crop (comp-spec.mjs --crop event-filters); its ink box, border, fill, radius, and label size are the comp's --></div>
  <div class="r-event-table region control" data-region="event-table"><!-- Semantic table headers and three selectable event rows, with camera, type, capture and recording columns: rebuild the control's chrome from the crop (comp-spec.mjs --crop event-table); its ink box, border, fill, radius, and label size are the comp's --></div>
  <div class="r-recorded-title region text" data-region="recorded-title"><!-- Recorded Today 14:32, Storage room 01 --><p style="font-size:var(--r-recorded-title-font);line-height:1.05;margin:0">recorded-title</p></div>
  <figure class="r-recording region plate" data-region="recording"><img src="../../../frontend/public/demo/storage-room-01-recorded.jpg" alt="" style="width:100%;height:100%;object-fit:contain;object-position:top left"></figure>
  <div class="r-playback-controls region control" data-region="playback-controls"><!-- Play, seek, elapsed time, mute and fullscreen media controls: rebuild the control's chrome from the crop (comp-spec.mjs --crop playback-controls); its ink box, border, fill, radius, and label size are the comp's --></div>
</main>
</body>
</html>
